name: Auto-tag on version bump

on:
  push:
    branches: [master]

concurrency:
  group: auto-tag-master
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync version to repository metadata
        id: version
        shell: pwsh
        run: |
          $tag = & ./.github/scripts/Check-ReleaseVersion.ps1 -UpdateRepositoryMetadata
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Commit updated repository metadata
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git diff --quiet -- repo.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add repo.json
            git commit -m "chore: sync repo.json for $TAG"
            git push origin HEAD:master
          fi

      - name: Create version tag
        id: tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists."
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN does not trigger a second workflow.
      - name: Start release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh workflow run release.yml --ref master -f "tag=$TAG"
